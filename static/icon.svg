<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Degen Trading Agent">
  <title>Degen Trading Agent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sfondo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#gloss)"/>

  <!-- Scintille: i token che esplodono (o si bruciano) -->
  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="14" cy="16" r="2"/>
    <circle cx="51" cy="13" r="1.6"/>
    <circle cx="53" cy="27" r="1.2"/>
  </g>

  <!-- Fiamma -->
  <path d="M32 8 C36 19 47 25 47 38.5 C47 48 40.3 55 32 55 C23.7 55 17 48 17 38.5
           C17 31 21 26.5 25 22.5 C24.8 28.5 27 32 30 33.5 C28.6 25 29.5 16.5 32 8 Z"
        fill="#ffffff" fill-opacity="0.95"/>

  <!-- Cuore della fiamma -->
  <path d="M32.5 32 C35.5 36.5 39 39.5 39 45 C39 49 36 52 32 52 C28 52 25 49 25 45
           C25 40.5 28.5 37.5 32.5 32 Z"
        fill="#fcd34d"/>
</svg>
