<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Intelligent Trading Agent">
  <title>Intelligent Trading Agent</title>
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Variante semplificata: due sole candele, pensata per 16 e 32 px -->
  <rect width="64" height="64" rx="12" fill="url(#bgs)"/>
  <g fill="#ffffff">
    <rect x="17" y="26" width="6" height="32" rx="3"/>
    <rect x="12" y="34" width="16" height="18" rx="4"/>
  </g>
  <g fill="#34d399">
    <rect x="41" y="6" width="6" height="48" rx="3"/>
    <rect x="36" y="14" width="16" height="32" rx="4"/>
  </g>
</svg>
